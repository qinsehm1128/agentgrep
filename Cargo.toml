[package]
name = "agentgrep"
version = "0.1.7"
edition = "2024"
description = "CLI-first code search and retrieval for agents"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
memchr = "2.7"
model2vec-rs = { version = "0.3", default-features = false, features = ["onig"], optional = true }
# Versions match qin-code's lockfile so enabling `treesitter` there adds no crates.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# Optional semantic re-ranking with Model2Vec static embeddings. Needs a
# local model directory at query time; never downloads anything itself.
semantic = ["dep:model2vec-rs"]
# AST-accurate structure items for languages the line-based extractor does
# not cover. One feature per grammar so embedders link only what they ship;
# `treesitter` enables all of them.
treesitter = ["ts-go", "ts-java", "ts-c", "ts-cpp", "ts-csharp", "ts-ruby", "ts-php", "ts-kotlin", "ts-swift"]
# Internal: the shared tree-sitter runtime. Enabled by every `ts-*` feature.
ts-core = ["dep:tree-sitter"]
ts-go = ["ts-core", "dep:tree-sitter-go"]
ts-java = ["ts-core", "dep:tree-sitter-java"]
ts-c = ["ts-core", "dep:tree-sitter-c"]
ts-cpp = ["ts-core", "dep:tree-sitter-cpp"]
ts-csharp = ["ts-core", "dep:tree-sitter-c-sharp"]
ts-ruby = ["ts-core", "dep:tree-sitter-ruby"]
ts-php = ["ts-core", "dep:tree-sitter-php"]
ts-kotlin = ["ts-core", "dep:tree-sitter-kotlin-ng"]
ts-swift = ["ts-core", "dep:tree-sitter-swift"]

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.14"
